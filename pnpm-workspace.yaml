packages:
  - "apps/*"
  - "packages/*"

# pnpm 11 only runs dependency build scripts for packages listed here.
allowBuilds:
  esbuild: true
  prisma: true
  "@prisma/client": true
  "@tailwindcss/oxide": true
  bcrypt: true
  sharp: true
  "@parcel/watcher": true
  "@prisma/engines": true

patchedDependencies:
  "@react-pdf/layout@5.2.0": patches/@react-pdf__layout@5.2.0.patch

# Sube paquetes transitivos con CVE sin publicación que lo solucione. Versiones
# fijadas por npm audit --prod (2026-10); al resolverse en el upstream se pueden
# quitar. Todas son backward-compatible (patch/minor dentro del mismo major).
overrides:
  proxy-addr: "^2.0.8"
  multer: "^2.4.0"
  engine.io: "^6.6.10"
  qs: "^6.16.0"
  nanoid: "^3.3.20"
  source-map-js: "^1.2.2"
  prosemirror-view: "^1.42.3"
  js-yaml: "^4.3.2"
  "minimatch>brace-expansion": "^1.1.21"

strictDepBuilds: false
