# nginx de la web (archivos estáticos de Vite).
#
# El enrutamiento no lo hace nginx: Caddy, que está arriba, manda /api a la API
# y todo lo demás a este contenedor. nginx solo sirve el SPA.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Nunca Asteroid. Caddy ya agrega sus propios headers; esto evita duplicados
    # o conflictos en la cadena.
    server_tokens off;

    # --- Compresión -------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # --- Assets con hash en el nombre --------------------------------------
    # Vite nombra los archivos index-DHxk1P6x.js, así que el contenido no cambia
    # nunca bajo una misma URL: se pueden cachear para siempre. Un cache inválido
    # obligaría al cliente a re-bajar 1.29 MB en cada deploy.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    # --- Fuentes y media ---------------------------------------------------
    location ~* \.(?:woff2?|ttf|otf|eot|svg|png|jpe?g|gif|webp|avif|ico)$ {
        expires 30d;
        add_header Cache-Control "public" always;
        access_log off;
        try_files $uri =404;
    }

    # --- Fallback de SPA ---------------------------------------------------
    # React Router resuelve en el cliente: /tasks/42 se sirve con el mismo
    # index.html que /. Sin esto, recargar en cualquier ruta da un 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html lleva el bundle con hash, así que nunca se cachea: es el archivo
    # que apunta a los assets nuevos.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
        expires 0;
    }

    # --- Endpoints de infraestructura -------------------------------------
    # Que el healthcheck de Compose y un load balancer externo no traversed el
    # fallback: /health tiene que devolver 200, no el index.html de la SPA.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain always;
        return 200 "ok\n";
    }

    # --- Archivos ocultos --------------------------------------------------
    # Nunca se sirven, aunque estén en el build. .git y .env en un sitio público
    # son una fuga directa de credenciales.
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
